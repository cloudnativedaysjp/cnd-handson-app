// PROPOSED (#105): tasks belong to a project. Adds project_id to task.CreateTaskRequest (= 8)
// and task.Task (= 9). Not in proto/ yet; needs human approval.
syntax = "proto3";
package task;

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (TaskResponse);
}
message CreateTaskRequest {
  string title = 1;
  string description = 2;
  string status = 3;
  string project_id = 8;
}
message TaskResponse { Task task = 1; }
message Task { string id = 1; string title = 2; string project_id = 9; }
