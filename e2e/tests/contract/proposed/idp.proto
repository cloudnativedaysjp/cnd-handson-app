// PROPOSED (#104): not in proto/ yet; needs human approval. Login/Register/Refresh of handson-idp.
syntax = "proto3";
package idp;

service IdpService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (TokenResponse);
  rpc Refresh(RefreshRequest) returns (TokenResponse);
}
message RegisterRequest { string name = 1; string email = 2; string password = 3; }
message RegisterResponse { string user_id = 1; }
message LoginRequest { string email = 1; string password = 2; }
message RefreshRequest { string refresh_token = 1; }
message TokenResponse {
  string access_token = 1;  // RS256 JWT
  string refresh_token = 2;
  int64 expires_at = 3;
}
