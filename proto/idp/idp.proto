syntax = "proto3";

package idp;

option go_package = "github.com/cloudnativedaysjp/cnd-handson-app/gen/go/idp;idppb";

// JWKS / openid-configuration は HTTP で公開する（proto 対象外）。roles は JWT の claim。
service IdpService {
  // ユーザーの登録
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // ログイン（アクセストークンとリフレッシュトークンを発行）
  rpc Login(LoginRequest) returns (TokenResponse);

  // アクセストークンの再発行
  rpc Refresh(RefreshRequest) returns (TokenResponse);
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message TokenResponse {
  string access_token = 1; // RS256 JWT
  string refresh_token = 2;
  int64 expires_at = 3; // アクセストークンの失効時刻 (Unix 秒)
}
