syntax = "proto3";

package project;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/cloudnativedaysjp/cnd-handson-app/gen/go/project;projectpb";

// ================================
// サービス定義
// ================================
service ProjectService {
  // プロジェクトの作成
  rpc CreateProject(CreateProjectRequest) returns (ProjectResponse);

  // プロジェクトの更新
  rpc UpdateProject(UpdateProjectRequest) returns (ProjectResponse);

  // プロジェクトの取得
  rpc GetProject(GetProjectRequest) returns (ProjectResponse);

  // プロジェクト一覧の取得
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // プロジェクトの削除
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // プロジェクトに属するタスクの一覧取得（task サービスへ集約）
  rpc ListProjectTasks(ListProjectTasksRequest) returns (ListProjectTasksResponse);

  // プロジェクトに属するカラムの一覧取得（column サービスへ集約）
  rpc ListProjectColumns(ListProjectColumnsRequest) returns (ListProjectColumnsResponse);

  // x-user-id がプロジェクトの所有者か確かめる。task / column が操作の前に呼ぶ。所有者でなければ NOT_FOUND
  rpc CheckProjectAccess(CheckProjectAccessRequest) returns (CheckProjectAccessResponse);
}

// ================================
// リクエスト / レスポンスメッセージ
// ================================

// --- CreateProject ---
message CreateProjectRequest {
  string name = 1;
  string description = 2;
  string owner_id = 3;
}

// --- UpdateProject ---
message UpdateProjectRequest {
  string id = 1;
  string name = 2;
  string description = 3;
}

// --- GetProject ---
message GetProjectRequest {
  string id = 1;
}

// --- ListProjects ---
message ListProjectsRequest {
  string owner_id = 1; // 特定のユーザーが所有するプロジェクトに絞り込むためのフィールド
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

// --- Project ---
message Project {
  string id = 1;
  string name = 2;
  string description = 3;
  string owner_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// --- ProjectResponse ---
message ProjectResponse {
  Project project = 1;
}

// --- DeleteProject ---
message DeleteProjectRequest {
  string id = 1;
}

message DeleteProjectResponse {
  bool success = 1;
}


// --- ListProjectTasks ---
// task / column の内部型には結合させず、入口向けの型を project 側で持つ。
message ListProjectTasksRequest {
  string project_id = 1;
}

message ListProjectTasksResponse {
  repeated ProjectTask tasks = 1;
}

message ProjectTask {
  string id = 1;
  string title = 2;
  string status = 3;
  string column_id = 4;
  string project_id = 5;
}

// --- ListProjectColumns ---
message ListProjectColumnsRequest {
  string project_id = 1;
}

message ListProjectColumnsResponse {
  repeated ProjectColumn columns = 1;
}

// column に順序フィールドはないため id と name のみ。
message ProjectColumn {
  string id = 1;
  string name = 2;
}

// --- CheckProjectAccess ---
message CheckProjectAccessRequest {
  string project_id = 1;
}

message CheckProjectAccessResponse {}
