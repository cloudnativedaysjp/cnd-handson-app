# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ja-JP
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # push のたびの再レビューは待ち時間と通知が多いため、再レビューは @coderabbitai review で依頼する
    auto_incremental_review: false
    # Dependabot の Action 更新は CI で確認する。workflow 変更ルールの誤検知で会話の解決待ちにならないよう対象外にする
    ignore_usernames:
      - "dependabot[bot]"
  sequence_diagrams: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  estimate_code_review_effort: false
  in_progress_fortune: false
  # 生成物は proto とロックファイルの差分で確認するため、行単位の指摘は不要
  path_filters:
    - "!backend/*/proto/*.pb.go"
    - "!backend/*/gen/**"
    - "!**/pnpm-lock.yaml"
    - "!**/go.sum"
  path_instructions:
    - path: "**"
      instructions: |
        過剰な作り込みを指摘する（より少ないコードで済む代替を具体的に示す）。
        - 実装が 1 つしかない interface、製品が 1 つしかない factory、使われていない設定値やフラグ
        - 要件を満たす標準ライブラリ・既存の依存・プラットフォーム機能があるのに、自前実装または新しい依存を追加している場合
        - リポジトリ内に既にあるヘルパーや型の再実装
        - 「将来のため」の足場、呼ばれていない関数、1 か所でしか使わない抽象化
    - path: "{backend,bff,frontend}/**"
      instructions: |
        docs/conventions.md の約束に反していないかを優先して見る。
        - 受け取った context を下流の gRPC・DB に渡しているか（context.Background() / TODO() を使っていないか）
        - OTel の endpoint や service.name、接続情報・秘密値をコードに直書きしていないか
        - gRPC health、SIGTERM での graceful shutdown、非 root 実行
    - path: "{proto,e2e}/**"
      instructions: |
        proto と契約テストは仕様。フィールド番号の再利用、reserved の欠落、テストの skip・削除・期待値の緩和を指摘する。
    - path: "**/*_test.go"
      instructions: テストを通すための skip・削除・期待値の緩和がないかを見る。
knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "docs/conventions.md"
