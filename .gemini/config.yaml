have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: true
# 生成物は proto とロックファイルの差分で確認するため、行単位の指摘は不要
ignore_patterns:
  - "backend/*/proto/*.pb.go"
  - "backend/*/gen/**"
  - "**/pnpm-lock.yaml"
  - "**/go.sum"
