version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Package names (idp, task, ...) are wire-visible; adding .v1 would be an API rename.
    - PACKAGE_VERSION_SUFFIX
    # Shared XxxResponse types across RPCs are the existing API; renaming breaks every client.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
  except:
    # go_package moved to gen/go/<svc> (Go stubs only; not a wire change).
    - FILE_SAME_GO_PACKAGE
