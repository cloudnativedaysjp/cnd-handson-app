name: Lint and Format

on:
  push:
    branches-ignore: [ main ]

permissions:
  contents: read

# 同じ PR / ブランチへの連続 push では古い実行を止め、ランナー待ちを減らす
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.25.14
  GOLANGCI_LINT_VERSION: v2.14
  PYTHON_VERSION: 3.12

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.changes.outputs.go }}
      python: ${{ steps.changes.outputs.python }}
      ts: ${{ steps.changes.outputs.ts }}
      proto: ${{ steps.changes.outputs.proto }}
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        run: .github/scripts/detect-changes.sh >> "$GITHUB_OUTPUT"

  typescript-lint-format:
    name: TypeScript lint and format
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js and PNPM
        uses: ./.github/actions/setup-node
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint with Biome
        run: npx @biomejs/biome lint ./${{ matrix.service }}/src/
      
      - name: Format check with Biome
        run: npx @biomejs/biome format ./${{ matrix.service }}/src/ --verbose
  
  go-lint-format:
    name: Go lint and format
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
          
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted with gofmt:"
            gofmt -d .
            exit 1
          fi

  python-lint-format:
      name: Python lint and format
      needs: changes
      if: needs.changes.outputs.python == 'true'
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: backend/column

      steps:
        - name: Checkout code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false
        
        - name: Setup Python
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: 'pip'
        
        - name: Install dependencies
          run: pip install -r requirements.txt -r requirements-dev.txt
        
        - name: Lint with Flake8
          run: flake8 . --exclude=venv,proto,gen --ignore=E501
        
        - name: Format check with Black
          run: black --check . --exclude "(venv|proto|gen)"
