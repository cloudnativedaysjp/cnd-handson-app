name: Lint and Format

on:
  push:
    branches-ignore: [ main ]

permissions:
  contents: read

env:
  GO_VERSION: 1.24.3
  GOLANGCI_LINT_VERSION: v2.1
  PYTHON_VERSION: 3.12

jobs:
  typescript-lint-format:
    name: TypeScript lint and format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      
      - name: Setup Node.js and PNPM
        uses: ./.github/actions/setup-node
      
      - name: Install dependencies
        run: |
          # Install root dependencies for Biome
          pnpm install
          # Install service dependencies
          cd ./${{ matrix.service }}
          pnpm install
      
      - name: Lint with Biome
        run: npx @biomejs/biome lint ./${{ matrix.service }}/src/
      
      - name: Format check with Biome
        run: npx @biomejs/biome format ./${{ matrix.service }}/src/ --verbose
  
  go-lint-format:
    name: Go lint and format
    runs-on: ubuntu-latest
    strategy:
      matrix:
          service: [project, user, session, task]
          include:
            - service: project
              path: backend/project
            - service: user
              path: backend/user
            - service: session
              path: backend/session
            - service: task
              path: backend/task
  
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./${{ matrix.path }}/go.sum
          
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ./${{ matrix.path }}

      - name: Format
        working-directory: ./${{ matrix.path }}
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted with gofmt:"
            gofmt -d .
            exit 1
          fi

  python-lint-format:
      name: Python lint and format
      runs-on: ubuntu-latest
      strategy:
        matrix:
            service: [column, role]
            include:
              - service: column
                path: backend/column
              - service: role
                path: backend/role

      steps:
        - name: Checkout code
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
          with:
            persist-credentials: false
        
        - name: Setup Python
          uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: 'pip'
        
        - name: Install dependencies
          working-directory: ./${{ matrix.path }}
          run: |
            pip install -r requirements.txt -r requirements-dev.txt
        
        - name: Lint with Flake8
          working-directory: ./${{ matrix.path }}
          run: flake8 . --exclude=venv,proto,gen --ignore=E501
        
        - name: Format check with Black
          working-directory: ./${{ matrix.path }}
          run: black --check . --exclude "(venv|proto|gen)"
