name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  GO_VERSION: 1.24.3
  PYTHON_VERSION: 3.12

jobs:
  typescript-test:
    name: TypeScript Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and PNPM
        uses: ./.github/actions/setup-node
      
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pnpm install
      
      - name: Test
        working-directory: ${{ matrix.service }}
        run: pnpm test

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [project, user, session, task, telemetry]
        include:
          - service: project
            path: backend/project
          - service: user
            path: backend/user
          - service: session
            path: backend/session
          - service: task
            path: backend/task
          - service: telemetry
            path: pkg/telemetry

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install dependencies
        working-directory: ./${{ matrix.path }}
        run: go mod download
      
      - name: Test
        working-directory: ./${{ matrix.path }}
        env:
          CGO_ENABLED: 0
        run: go test ./... -v
  
  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [column, role]
        include:
          - service: column
            path: backend/column
          - service: role
            path: backend/role

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./${{ matrix.path }}
        run: |
          pip install -r requirements.txt

      - name: Test
        working-directory: ./${{ matrix.path }}
        run: pytest