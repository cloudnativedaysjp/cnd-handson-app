name: Build and Push Docker Images

on:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}

jobs:
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: project
            context: .
            file: backend/project/Dockerfile
          - image: idp
            context: .
            file: backend/idp/Dockerfile
          - image: task
            context: .
            file: backend/task/Dockerfile
          - image: column
            context: backend/column
            file: backend/column/Dockerfile
          # フロントエンドは版（VARIANT）をビルド時に埋め込むので、版ごとにビルドしてタグで分ける
          - image: handson
            context: .
            file: bff/Dockerfile
            variant: legacy
          - image: handson
            context: .
            file: bff/Dockerfile
            variant: modern
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} ${{ matrix.variant }} Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: VARIANT=${{ matrix.variant }}
          push: true
          # フロントエンドのタグは <版> と <版>-sha-<sha>。ほかは latest と sha-<sha>
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}:${{ matrix.variant || 'latest' }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.image }}:${{ matrix.variant && format('{0}-', matrix.variant) || '' }}sha-${{ github.sha }}
