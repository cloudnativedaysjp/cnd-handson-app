name: Build and Push Docker Images

on:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}

jobs:
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, project, user, session, task, column, role]
        include:
          - service: frontend
            context: frontend
            file: frontend/Dockerfile
          - service: project
            context: .
            file: backend/project/Dockerfile
          - service: user
            context: .
            file: backend/user/Dockerfile
          - service: session
            context: .
            file: backend/session/Dockerfile
          - service: task
            context: .
            file: backend/task/Dockerfile
          - service: column
            context: backend/column
            file: backend/column/Dockerfile
          - service: role
            context: backend/role
            file: backend/role/Dockerfile
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.service }}:sha-${{ github.sha }}
