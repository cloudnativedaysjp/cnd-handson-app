name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  buf-lint:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.57.0
          github_token: ${{ github.token }}
      - run: buf lint
      - name: buf breaking
        if: github.event_name == 'pull_request'
        # buf clones the local repo, so a local main branch must exist
        run: |
          git fetch --no-tags origin main:main
          buf breaking --against '.git#branch=main,subdir=proto'
      - name: Generated code is up to date
        run: |
          make gen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is stale. Run 'make gen' and commit the result."
            git status --porcelain
            exit 1
          fi

  e2e:
    name: make up && make e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # corepack provides pnpm at the version pinned by e2e/package.json
      - run: corepack enable
      - id: pnpm-store
        run: echo "path=$(cd e2e && pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      # compose (and bake reading it) needs .env via env_file
      - run: make .env
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # -migrate services reuse the -service images, so only those are built.
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose.yaml
          targets: user-service,session-service,role-service,project-service,frontend
          load: true
          set: |
            frontend.tags=${{ github.event.repository.name }}-frontend
            user-service.cache-from=type=gha,scope=user-service
            user-service.cache-to=type=gha,mode=max,scope=user-service
            session-service.cache-from=type=gha,scope=session-service
            session-service.cache-to=type=gha,mode=max,scope=session-service
            role-service.cache-from=type=gha,scope=role-service
            role-service.cache-to=type=gha,mode=max,scope=role-service
            project-service.cache-from=type=gha,scope=project-service
            project-service.cache-to=type=gha,mode=max,scope=project-service
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,mode=max,scope=frontend
      - run: make up UP_BUILD=
      - run: make e2e
      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-screenshots
          path: e2e/screenshots/
          if-no-files-found: warn
          retention-days: 3
