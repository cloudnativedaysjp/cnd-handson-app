name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buf-lint:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.3
          cache: false
      - run: go run github.com/bufbuild/buf/cmd/buf@v1.57.0 lint
      - name: Generated code is up to date
        run: |
          make gen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is stale. Run 'make gen' and commit the result."
            git status --porcelain
            exit 1
          fi

  e2e:
    name: make up && make e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Makefile runs pnpm through corepack (version pinned by e2e/package.json)
      - run: corepack enable
      - id: pnpm-store
        run: echo "path=$(cd e2e && corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - run: make up
      - run: cd e2e && corepack pnpm install --frozen-lockfile && corepack pnpm exec playwright install --with-deps chromium
      - run: make e2e
      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: e2e/screenshots/
          if-no-files-found: warn
      - run: make down
        if: always()
