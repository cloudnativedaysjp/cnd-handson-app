name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

jobs:
  buf-lint:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.3
          cache: false
      - run: go run github.com/bufbuild/buf/cmd/buf@v1.57.0 lint

  e2e:
    name: make up && make e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Makefile runs pnpm through corepack (version pinned by e2e/package.json)
      - run: corepack enable
      - run: make up
      - run: make e2e
      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: e2e/screenshots/
          if-no-files-found: warn
      - run: make down
        if: always()
