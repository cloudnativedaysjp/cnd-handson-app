name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  buf-lint:
    name: buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.57.0
          github_token: ${{ github.token }}
      - run: buf lint
      - name: Generated code is up to date
        run: |
          make gen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is stale. Run 'make gen' and commit the result."
            git status --porcelain
            exit 1
          fi

  e2e:
    name: make up && make e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # corepack provides pnpm at the version pinned by e2e/package.json
      - run: corepack enable
      - id: pnpm-store
        run: echo "path=$(cd e2e && pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.cache/ms-playwright
          key: e2e-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - uses: docker/setup-buildx-action@v3
      # -migrate services reuse the -service images, so only those are built.
      - uses: docker/bake-action@v6
        with:
          files: docker-compose.yaml
          targets: user-service,session-service,role-service,project-service,frontend
          load: true
          set: |
            frontend.tags=${{ github.event.repository.name }}-frontend
            user-service.cache-from=type=gha,scope=user-service
            user-service.cache-to=type=gha,mode=max,scope=user-service
            session-service.cache-from=type=gha,scope=session-service
            session-service.cache-to=type=gha,mode=max,scope=session-service
            role-service.cache-from=type=gha,scope=role-service
            role-service.cache-to=type=gha,mode=max,scope=role-service
            project-service.cache-from=type=gha,scope=project-service
            project-service.cache-to=type=gha,mode=max,scope=project-service
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,mode=max,scope=frontend
      - run: make up UP_BUILD=
      - run: cd e2e && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: make e2e
      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: e2e/screenshots/
          if-no-files-found: warn
