services:
  
    user-migrate:
      build:
        context: ./backend/user
        dockerfile: Dockerfile
        target: bin
        platforms:
          - linux/amd64
      image: user:latest
      container_name: user-migrate
      env_file:
        - .env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_DB: ${DB_DB}
      entrypoint: ["/user-service", "migrate"]
      platform: linux/amd64
      depends_on:
        db:
          condition: service_healthy
    user-service:
      build:
        context: ./backend/user
        dockerfile: Dockerfile
        target: bin
        platforms:
          - linux/amd64
      image: user:latest
      container_name: user-service
      ports:
        - "50051:50051"
      env_file:
        - .env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_DB: ${DB_DB}
      entrypoint: ["/user-service", "server"]
      platform: linux/amd64
      depends_on:
        user-migrate:
          condition: service_completed_successfully
        db:
          condition: service_healthy
    session-migrate:
      build:
        context: ./backend/session
        dockerfile: Dockerfile
        target: bin
        platforms:
          - linux/amd64
      image: session:latest
      container_name: session-migrate
      env_file:
        - .env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_DB: ${DB_DB}
      entrypoint: ["/session-service", "migrate"]      
      platform: linux/amd64
      depends_on:
        db:
          condition: service_healthy
    session-service:
      build:
        context: ./backend/session
        dockerfile: Dockerfile
        target: bin
        platforms:
          - linux/amd64
      image: session:latest
      container_name: session-service
      ports:
        - "50052:50051"
      env_file:
        - .env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_DB: ${DB_DB}
      entrypoint: ["/session-service", "server"]      
      platform: linux/amd64
      depends_on:
        session-migrate:
          condition: service_completed_successfully
        db:
          condition: service_healthy
    frontend:
      container_name: frontend
      build: ./frontend
      tty: true
      volumes:
        - ./frontend:/app
        - /app/node_modules
        - ./frontend/.pnpm-store/:/app/.pnpm-store/
      ports:
        - 5173:5173
      environment:
        - PNPM_STORE_PATH=/app/.pnpm-store
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
        interval: 3s
        timeout: 3s
        retries: 40
    role-migrate:
      build:
        context: ./backend/role
        dockerfile: Dockerfile
      image: role:latest
      container_name: role-migrate
      env_file:
        - .env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_DB: ${DB_DB}
        PYTHON_PATH: /app
      entrypoint: ["python3", "./cmd/server/main.py", "migrate"]      
      platform: linux/amd64
      depends_on:
        db:
          condition: service_healthy
    role-service:
      build:
        context: ./backend/role
        dockerfile: Dockerfile
      image: role:latest
      container_name: role-service
      ports:
        - "50054:50051"
      env_file:
        - .env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_DB: ${DB_DB}
        PYTHON_PATH: /app
      entrypoint: ["python3", "./cmd/server/main.py", "server"]
      healthcheck:
        test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2)"]
        interval: 3s
        timeout: 3s
        retries: 20
      platform: linux/amd64
      depends_on:
        role-migrate:
          condition: service_completed_successfully
        db:
          condition: service_healthy
    project-migrate:
      build:
        context: ./backend/project
        dockerfile: Dockerfile
      image: project:latest
      container_name: project-migrate
      env_file:
        - .env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_DB: ${DB_DB}
      entrypoint: ["./project-service", "migrate"]      
      platform: linux/amd64
      depends_on:
        db:
          condition: service_healthy
    project-service:
      build:
        context: ./backend/project
        dockerfile: Dockerfile
      image: project:latest
      container_name: project-service
      ports:
        - "50053:50053"
      env_file:
        - .env
      environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_DB: ${DB_DB}
        PORT: 50053
      entrypoint: ["./project-service", "server"]      
      platform: linux/amd64
      depends_on:
        project-migrate:
          condition: service_completed_successfully
        db:
          condition: service_healthy
    db:
      image: postgres:17
      restart: unless-stopped
      ports:
        - "5432:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data
      env_file:
        # Ensure that the variables in .env match the same variables in devcontainer.json
        - .env
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_DB}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 2s
        timeout: 3s
        retries: 30
volumes:
  postgres-data:

