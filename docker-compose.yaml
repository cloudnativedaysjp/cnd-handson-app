services:
  
    idp-migrate:
      build:
        context: .
        dockerfile: backend/idp/Dockerfile
        target: bin
      image: idp:latest
      env_file:
        - .env
      entrypoint: ["/idp-service", "migrate"]
      depends_on:
        db:
          condition: service_healthy
    idp-service:
      build:
        context: .
        dockerfile: backend/idp/Dockerfile
        target: bin
      image: idp:latest
      ports:
        - "50051:50051"
        - "8082:8080"
      env_file:
        - .env
      environment:
        OTEL_SERVICE_NAME: handson-idp
        OTEL_RESOURCE_ATTRIBUTES: service.namespace=handson
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
        OTEL_PROPAGATORS: tracecontext,baggage
      entrypoint: ["/idp-service", "server"]
      healthcheck:
        test: ["CMD", "/grpc_health_probe", "-addr=:50051"]
        interval: 3s
        start_period: 30s
        start_interval: 1s
        timeout: 3s
        retries: 20
      depends_on:
        idp-migrate:
          condition: service_completed_successfully
        db:
          condition: service_healthy
    frontend:
      build:
        context: .
        dockerfile: frontend/Dockerfile
      tty: true
      volumes:
        - ./frontend:/app/frontend
        - /app/frontend/node_modules
      ports:
        - 5173:5173
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
        interval: 3s
        start_period: 30s
        start_interval: 1s
        timeout: 3s
        retries: 40
    task-migrate:
      build:
        context: .
        dockerfile: backend/task/Dockerfile
        target: bin
      image: task:latest
      env_file:
        - .env
      entrypoint: ["/task-service", "migrate"]
      depends_on:
        db:
          condition: service_healthy
    task-service:
      build:
        context: .
        dockerfile: backend/task/Dockerfile
        target: bin
      image: task:latest
      ports:
        - "50055:50051"
      env_file:
        - .env
      environment:
        OTEL_SERVICE_NAME: handson-task
        PROJECT_ADDR: project-service:50051
        OTEL_RESOURCE_ATTRIBUTES: service.namespace=handson
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
        OTEL_PROPAGATORS: tracecontext,baggage
      entrypoint: ["/task-service", "server"]
      healthcheck:
        test: ["CMD", "/grpc_health_probe", "-addr=:50051"]
        interval: 3s
        start_period: 30s
        start_interval: 1s
        timeout: 3s
        retries: 20
      depends_on:
        task-migrate:
          condition: service_completed_successfully
        db:
          condition: service_healthy
    column-migrate:
      build:
        context: ./backend/column
        target: runtime
      image: column:latest
      env_file:
        - .env
      entrypoint: ["python", "./cmd/server/main.py", "migrate"]
      depends_on:
        db:
          condition: service_healthy
    column-service:
      build:
        context: ./backend/column
        target: runtime
      image: column:latest
      ports:
        - "50056:50051"
      env_file:
        - .env
      environment:
        OTEL_SERVICE_NAME: handson-column
        PROJECT_ADDR: project-service:50051
        OTEL_RESOURCE_ATTRIBUTES: service.namespace=handson
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
        OTEL_PROPAGATORS: tracecontext,baggage
      entrypoint: ["python", "./cmd/server/main.py", "server"]
      # gRPC の猶予 5 秒 + telemetry の終了 3 秒が収まるようにする
      stop_grace_period: 15s
      healthcheck:
        test: ["CMD", "/grpc_health_probe", "-addr=:50051"]
        interval: 3s
        start_period: 30s
        start_interval: 1s
        timeout: 3s
        retries: 20
      depends_on:
        column-migrate:
          condition: service_completed_successfully
        db:
          condition: service_healthy
    project-migrate:
      build:
        context: .
        dockerfile: backend/project/Dockerfile
        target: bin
      image: project:latest
      env_file:
        - .env
      entrypoint: ["/project-service", "migrate"]
      depends_on:
        db:
          condition: service_healthy
    project-service:
      build:
        context: .
        dockerfile: backend/project/Dockerfile
        target: bin
      image: project:latest
      ports:
        - "50053:50051"
      env_file:
        - .env
      environment:
        OTEL_SERVICE_NAME: handson-project
        TASK_ADDR: task-service:50051
        COLUMN_ADDR: column-service:50051
        OTEL_RESOURCE_ATTRIBUTES: service.namespace=handson
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
        OTEL_PROPAGATORS: tracecontext,baggage
      entrypoint: ["/project-service", "server"]
      healthcheck:
        test: ["CMD", "/grpc_health_probe", "-addr=:50051"]
        interval: 3s
        start_period: 30s
        start_interval: 1s
        timeout: 3s
        retries: 20
      depends_on:
        project-migrate:
          condition: service_completed_successfully
        task-service:
          condition: service_healthy
        column-service:
          condition: service_healthy
        db:
          condition: service_healthy
    handson-legacy:
      build:
        context: .
        dockerfile: bff/Dockerfile
        target: bin
        args:
          VARIANT: legacy
      image: handson:legacy
      ports:
        - "8080:8080"
      environment:
        PROJECT_ADDR: project-service:50051
        IDP_ADDR: idp-service:50051
        IDP_JWKS_URL: http://idp-service:8080/.well-known/jwks.json
        # 署名鍵を渡さないよう env_file は使わず、検証に要る値だけ渡す
        IDP_ISS: ${IDP_ISS}
        IDP_AUD: ${IDP_AUD}
        OTEL_SERVICE_NAME: handson-legacy
        OTEL_RESOURCE_ATTRIBUTES: service.namespace=handson,app.variant=legacy,app.color=blue
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
        OTEL_PROPAGATORS: tracecontext,baggage
      healthcheck: &entry-healthcheck
        test: ["CMD", "/handson-entry", "healthcheck"]
        interval: 3s
        start_period: 30s
        start_interval: 1s
        timeout: 3s
        retries: 20
    handson-modern:
      build:
        context: .
        dockerfile: bff/Dockerfile
        target: bin
        args:
          VARIANT: modern
      image: handson:modern
      ports:
        - "8081:8080"
      environment:
        PROJECT_ADDR: project-service:50051
        IDP_ADDR: idp-service:50051
        IDP_JWKS_URL: http://idp-service:8080/.well-known/jwks.json
        IDP_ISS: ${IDP_ISS}
        IDP_AUD: ${IDP_AUD}
        OTEL_SERVICE_NAME: handson-modern
        OTEL_RESOURCE_ATTRIBUTES: service.namespace=handson,app.variant=modern,app.color=green
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
        OTEL_PROPAGATORS: tracecontext,baggage
      healthcheck: *entry-healthcheck
    db:
      image: postgres:17
      restart: unless-stopped
      volumes:
        - postgres-data:/var/lib/postgresql/data
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_DB}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 2s
        start_period: 30s
        start_interval: 1s # 起動直後だけ短い間隔で確認し、healthy までの待ちを縮める
        timeout: 3s
        retries: 30
    # トレースを見るときだけ起動する（COMPOSE_PROFILES=otel make up）。起動しないときは送信に失敗するだけで、サービスは止まらない
    otel-lgtm:
      image: grafana/otel-lgtm:0.11.10
      profiles: [otel]
      ports:
        # Grafana は匿名でも管理者として入れるので、手元からだけ開けるようにする
        - "127.0.0.1:3001:3000"
volumes:
  postgres-data:

