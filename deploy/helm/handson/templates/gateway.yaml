{{- with .Values.entry.gateway }}
{{- if .enabled }}
{{- $gw := . }}
{{- if .create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: handson
spec:
  gatewayClassName: {{ .className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: handson-entry
spec:
  parentRefs:
    {{- include "handson.gatewayParentRefs" $gw | nindent 4 }}
  {{- with .hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        {{- range $variant, $weight := .weights }}
        - name: handson-{{ $variant }}
          port: 8080
          weight: {{ $weight }}
        {{- end }}
{{- range $variant, $host := .hosts }}
---
# 版を直接開くための HTTPRoute。重みに関係なく、この版だけに送る
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: handson-{{ $variant }}
spec:
  parentRefs:
    {{- include "handson.gatewayParentRefs" $gw | nindent 4 }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - name: handson-{{ $variant }}
          port: 8080
{{- end }}
{{- end }}
{{- end }}
