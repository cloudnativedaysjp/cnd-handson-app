{{- if .Values.secret.create }}
{{- /* 生成した値は、upgrade のたびに作り直すと DB に繋がらず JWT も無効になるので、既存の Secret から引き継ぐ */}}
{{- $prev := (lookup "v1" "Secret" .Release.Namespace "handson-secrets").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: handson-secrets
type: Opaque
data:
  DB_PASSWORD: {{ .Values.postgres.password | b64enc | default (get $prev "DB_PASSWORD") | default (randAlphaNum 24 | b64enc) }}
  IDP_SIGNING_KEY: {{ .Values.idp.signingKey | b64enc | default (get $prev "IDP_SIGNING_KEY") | default (genPrivateKey "rsa" | b64enc | b64enc) }}
  IDP_DEMO_PASSWORD: {{ .Values.idp.demo.password | b64enc }}
{{- end }}
