# イメージは <registry>/<サービス名>:<tag>。
# handson-legacy / handson-modern は <registry>/handson:<版>（tag が latest のとき）か <registry>/handson:<版>-<tag>
image:
  registry: ghcr.io/cloudnativedaysjp/cnd-handson-app
  tag: latest
  pullPolicy: IfNotPresent

otel:
  # OTLP（http/protobuf）の送り先。空なら送らない。送れなくてもサービスは止まらない
  endpoint: ""

# Prometheus Operator が /metrics（9464）を集める ServiceMonitor を作る
serviceMonitor:
  enabled: false

secret:
  # false なら handson-secrets を作らず、先に作ってある同じ名前の Secret を使う。
  # Argo CD は helm template で描画するので lookup が効かず、生成した値が同期のたびに変わる。そのときは false にする
  create: true

idp:
  # JWT の iss / aud。handson-legacy / handson-modern も検証に同じ値を使う
  iss: http://handson-idp:8080
  aud: handson
  # base64 の PEM。空なら install 時に生成し、upgrade では引き継ぐ
  signingKey: ""
  # migrate が作るデモユーザー。email か password を空にすると作らない
  demo:
    email: demo@example.com
    password: demo-password

postgres:
  # false なら chart の Postgres を作らず、host の DB を使う
  enabled: true
  image: postgres:17
  storage: 1Gi
  # host と port は enabled=false のときだけ使う。chart の Postgres は 5432 で待ち受ける
  host: ""
  port: 5432
  database: handson
  user: handson
  # 空なら install 時に生成し、upgrade では引き継ぐ
  password: ""

# Deployment 名とサービス名は handson-<キー>。イメージ名は <キー>
services:
  idp:
    command: ["/idp-service"]
    http: true
  project:
    command: ["/project-service"]
    env:
      TASK_ADDR: handson-task:50051
      COLUMN_ADDR: handson-column:50051
  task:
    command: ["/task-service"]
    env:
      PROJECT_ADDR: handson-project:50051
  column:
    command: ["python", "./cmd/server/main.py"]
    env:
      PROJECT_ADDR: handson-project:50051
    # gRPC の猶予 5 秒と telemetry の終了 3 秒が収まるようにする
    terminationGracePeriodSeconds: 15

# フロントエンド（handson-legacy / handson-modern）。版はビルド時の VARIANT で決まる
entry:
  variants:
    legacy:
      color: blue
    modern:
      color: green
  ingress:
    enabled: false
    className: nginx
    # 版ごとのホスト名
    hosts:
      legacy: legacy.example.com
      modern: modern.example.com
  # Gateway API の HTTPRoute でフロントエンドを出す。版ごとの重みで振り分ける
  gateway:
    enabled: false
    # true なら Gateway も作る。false なら parentRefs の既存の Gateway につなぐ
    create: true
    className: cilium
    parentRefs: []
    # 重みで振り分ける HTTPRoute のホスト名。空ならホスト名で絞らない
    hostnames: []
    # 版ごとのホスト名。指定した版には、重みに関係なくその版だけに送る HTTPRoute も作る
    hosts: {}
    weights:
      legacy: 100
      modern: 0
